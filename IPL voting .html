<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IPL Team Voting & Comments</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(90deg, #1e3d59, #16324f);
      color: white;
      text-align: center;
      padding: 25px;
    }
    header h1 {
      margin: 0;
      font-size: 2.2em;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .team-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.2s;
    }
    .team-card:hover {
      transform: translateY(-5px);
    }
    .team-card img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: #fafafa;
    }
    .team-card h2 {
      text-align: center;
      margin: 10px 0;
      color: #1e3d59;
    }
    .vote-section {
      text-align: center;
      margin: 10px 0;
    }
    .vote-btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    .vote-btn:hover {
      background: #ff3b3b;
    }
    .vote-count {
      margin-top: 8px;
      font-weight: bold;
      color: #333;
    }
    .comment-box {
      padding: 10px;
    }
    .comment-box textarea {
      width: 100%;
      height: 60px;
      border-radius: 6px;
      border: 1px solid #ccc;
      padding: 8px;
      resize: none;
    }
    .comment-box button {
      margin-top: 8px;
      background: #1e3d59;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    .comment-box button:hover {
      background: #16324f;
    }
    .comments-list {
      margin-top: 10px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.9em;
      color: #444;
    }
    .comments-list p {
      background: #f9f9f9;
      padding: 6px;
      border-radius: 4px;
      margin: 4px 0;
    }
    footer {
      background: #1e3d59;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>IPL Team Voting & Comments</h1>
  <p>Vote for your favorite IPL team and share your thoughts!</p>
</header>

<div class="container">
  <!-- Chennai Super Kings -->
  <div class="team-card">
    <img src="https://upload.wikimedia.org/wikipedia/en/9/9a/Chennai_Super_Kings_Logo.png" alt="CSK Logo">
    <h2>Chennai Super Kings</h2>
    <div class="vote-section">
      <button class="vote-btn" onclick="vote('csk')">Vote</button>
      <div class="vote-count" id="csk-votes">Votes: 0</div>
    </div>
    <div class="comment-box">
      <textarea id="csk-comment" placeholder="Write your comment..."></textarea>
      <button onclick="addComment('csk')">Submit</button>
      <div class="comments-list" id="csk-comments"></div>
    </div>
  </div>

  <!-- Royal Challengers Bangalore -->
  <div class="team-card">
    <img src="https://upload.wikimedia.org/wikipedia/en/0/0d/Royal_Challengers_Bangalore_Logo.png" alt="RCB Logo">
    <h2>Royal Challengers Bangalore</h2>
    <div class="vote-section">
      <button class="vote-btn" onclick="vote('rcb')">Vote</button>
      <div class="vote-count" id="rcb-votes">Votes: 0</div>
    </div>
    <div class="comment-box">
      <textarea id="rcb-comment" placeholder="Write your comment..."></textarea>
      <button onclick="addComment('rcb')">Submit</button>
      <div class="comments-list" id="rcb-comments"></div>
    </div>
  </div>

  <!-- Mumbai Indians -->
  <div class="team-card">
    <img src="https://upload.wikimedia.org/wikipedia/en/2/2d/Mumbai_Indians_Logo.png" alt="MI Logo">
    <h2>Mumbai Indians</h2>
    <div class="vote-section">
      <button class="vote-btn" onclick="vote('mi')">Vote</button>
      <div class="vote-count" id="mi-votes">Votes: 0</div>
    </div>
    <div class="comment-box">
      <textarea id="mi-comment" placeholder="Write your comment..."></textarea>
      <button onclick="addComment('mi')">Submit</button>
      <div class="comments-list" id="mi-comments"></div>
    </div>
  </div>
</div>

<footer>
  <p>&copy; 2026 IPL Fan Zone | Designed by HIRTHICK</p>
</footer>

<script>
  // Store votes
  const votes = { csk: 0, rcb: 0, mi: 0 };

  function vote(team) {
    votes[team]++;
    document.getElementById(team + '-votes').innerText = "Votes: " + votes[team];
  }

  function addComment(team) {
    const textarea = document.getElementById(team + '-comment');
    const comment = textarea.value.trim();
    if (comment) {
      const commentsDiv = document.getElementById(team + '-comments');
      const p = document.createElement('p');
      p.textContent = comment;
      commentsDiv.appendChild(p);
      textarea.value = "";
    }
  }
</script>

</body>
</html>
